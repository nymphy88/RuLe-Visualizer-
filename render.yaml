services:
  # 1. Backend (Python FastAPI)
  - type: web
    name: my-fastapi-app
    env: python
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port 10000"
    healthCheckPath: /health

  # 2. Frontend (React/Vite)
  - type: web  # ย้ำ! ต้องใช้ web แม้จะเป็น static site
    name: my-react-app
    env: static # จุดที่บอกว่าเป็น Static คือตรงนี้ครับ
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    publishPath: dist # เมื่อใช้ env: static ต้องใช้ publishPath
    envVars:
      - key: VITE_BACKEND_URL
        fromService:
          type: web
          name: my-fastapi-app
          property: host
