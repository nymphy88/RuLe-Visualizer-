services:
  # 1. Backend (Python FastAPI) - อันนี้ถูกต้องอยู่แล้ว
  - type: web
    name: my-fastapi-app
    env: python
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port 10000"
    healthCheckPath: /health

  # 2. Frontend (React/Vite) - แก้ไขจาก Web เป็น Static เพื่อให้ประหยัดและเสถียร
  - type: static_site
    name: my-react-app
    env: static  # เพิ่ม env ให้ชัดเจน
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    publishPath: dist  # เปลี่ยนจาก staticPublishPath เป็น publishPath (ตามมาตรฐาน Render)
    envVars:
      - key: VITE_BACKEND_URL
        fromService:
          type: web
          name: my-fastapi-app
          property: host
